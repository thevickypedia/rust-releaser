name: Build, Test and Upload Artifact

# https://docs.github.com/en/actions/sharing-automations/reusing-workflows#using-inputs-and-secrets-in-a-reusable-workflow
on:
  workflow_call:
    inputs:
      publish_crate:
        type: boolean
        required: false
        default: true
      build_linux_amd:
        type: boolean
        required: false
        default: true
      build_linux_arm:
        type: boolean
        required: false
        default: true
      build_macos_amd:
        type: boolean
        required: false
        default: true
      build_macos_arm:
        type: boolean
        required: false
        default: true
      build_windows_amd:
        type: boolean
        required: false
        default: true
      build_windows_arm:
        type: boolean
        required: false
        default: true

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: thevickypedia-default
    permissions:
      contents: write

    outputs:
      release-id: ${{ steps.create-release.outputs.release_id }}
      release-tag: ${{ steps.create-release.outputs.release_tag }}
      release-flag: ${{ steps.set-release-flag.outputs.release_flag }}
      pkg-name: ${{ steps.get-package-info.outputs.pkg_name }}
      bin-name: ${{ steps.get-package-info.outputs.bin_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Get Package Name
        id: get-package-info
        run: |
          pkg_name=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].name')
          echo "Package Name: $pkg_name"
          echo "pkg_name=$pkg_name" >> $GITHUB_ENV
          echo "pkg_name=$pkg_name" >> "$GITHUB_OUTPUT"

          bin_name=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].targets[] | select(.kind[] == "bin" or .crate_types[] == "bin") | .name')
          echo "Bin Name: $bin_name"
          echo "bin_name=$bin_name" >> $GITHUB_ENV
          echo "bin_name=$bin_name" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Set Release Flag (crates.io mode)
        if: inputs.publish_crate
        id: set-release-flag-crates
        run: |
          current_version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          
          versions=$(curl -s https://crates.io/api/v1/crates/${{ env.pkg_name }} | jq -r '.versions[].num')
          
          echo "Current Package Version: $current_version"
          echo "Crates.io Versions: $versions"
          
          if echo "$versions" | grep -qx "$current_version"; then
            echo "release=false" >> $GITHUB_ENV
            echo "release_flag=false" >> $GITHUB_ENV
          else
            echo "release=true" >> $GITHUB_ENV
            echo "release_flag=true" >> $GITHUB_ENV
          fi
          
          echo "pkg_version=$current_version" >> $GITHUB_ENV
        shell: bash

      - name: Set Release Flag (GitHub Releases mode)
        if: ${{ !inputs.publish_crate }}
        id: set-release-flag-gh
        run: |
          current_version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          
          echo "Current Package Version: $current_version"
          
          releases=$(curl -s \
            "https://api.github.com/repos/${{ github.repository }}/releases?per_page=100" \
            -H "Authorization: token ${{ secrets.GIT_TOKEN }}")
          
          tags=$(echo "$releases" | jq -r '.[].tag_name')
          
          echo "Existing GitHub release tags:"
          echo "$tags"
          
          if echo "$tags" | grep -qx "v$current_version"; then
            echo "release=false" >> $GITHUB_ENV
            echo "release_flag=false" >> $GITHUB_ENV
          else
            echo "release=true" >> $GITHUB_ENV
            echo "release_flag=true" >> $GITHUB_ENV
          fi
          
          echo "pkg_version=$current_version" >> $GITHUB_ENV
        shell: bash

      - name: Set Release Flag
        id: set-release-flag
        run: |
          echo "release_flag=${{ env.release_flag }}" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Create New Release
        if: env.release == 'true'
        id: create-release
        run: |
          release_tag="v${{ env.pkg_version }}"
          echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"
          cargo_prerelease=("alpha" "beta" "rc")
          prerelease=false
          for cargo_pre in "${cargo_prerelease[@]}"; do
            if [[ $pkg_version == *"$cargo_pre"* ]]; then
              prerelease=true
              break
            fi
          done

          echo "Release Tag: $release_tag"
          latest_tag=$(curl -s -L https://api.github.com/repos/${{ github.repository }}/releases/latest | jq -r .tag_name)
          commit_msg="$(git log -1 --pretty=%B | sed ':a;N;$!ba;s/\n/\\n/g')"
          commit_msg+="\n**Full Changelog**: ${{ github.server_url }}/${{ github.repository }}/compare/$latest_tag...$release_tag"
          release_data="{\"tag_name\":\"$release_tag\",\"name\":\"$release_tag\",\"body\":\"$commit_msg\",\"draft\":false,\"prerelease\":$prerelease}"
          response=$(curl -X POST -H "Authorization: token ${{ secrets.GIT_TOKEN }}" \
            -d "$release_data" \
            "https://api.github.com/repos/${{ github.repository }}/releases")

          echo "Response: $response"
          release_id=$(echo $response | jq -r .id)
          if [ "$release_id" = "null" ] || [ -z "$release_id" ]; then
            echo "Error: release_id is null. Exiting with code 1."
            exit 1
          fi
          echo "Release ID: $release_id"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
        shell: bash

  prep:
    needs: release
    runs-on:
      - thevickypedia-default
      - posix
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Generate Matrix
        if: needs.release.outputs.release-flag == 'true'
        id: matrix
        run: |
          matrix=$(jq -n '
            {
              include: [
                (if "${{ inputs.build_linux_amd }}" == "true" then
                  {release_for:"Linux-x86_64", os:"linux-amd64", bin:"${{ needs.release.outputs.bin-name }}", name:"${{ needs.release.outputs.pkg-name }}-Linux-x86_64.tar.gz"}
                else empty end),
          
                (if "${{ inputs.build_linux_arm }}" == "true" then
                  {release_for:"Linux-arm64", os:"linux-arm64", bin:"${{ needs.release.outputs.bin-name }}", name:"${{ needs.release.outputs.pkg-name }}-Linux-arm64.tar.gz"}
                else empty end),
          
                (if "${{ inputs.build_macos_amd }}" == "true" then
                  {release_for:"macOS-x86_64", os:"darwin-amd64", bin:"${{ needs.release.outputs.bin-name }}", name:"${{ needs.release.outputs.pkg-name }}-Darwin-x86_64.tar.gz"}
                else empty end),
          
                (if "${{ inputs.build_macos_arm }}" == "true" then
                  {release_for:"macOS-arm64", os:"darwin-arm64", bin:"${{ needs.release.outputs.bin-name }}", name:"${{ needs.release.outputs.pkg-name }}-Darwin-arm64.tar.gz"}
                else empty end),
          
                (if "${{ inputs.build_windows_amd }}" == "true" then
                  {release_for:"Windows-x86_64", os:"windows-amd64", bin:"${{ needs.release.outputs.bin-name }}.exe", name:"${{ needs.release.outputs.pkg-name }}-Windows-x86_64.zip"}
                else empty end),
          
                (if "${{ inputs.build_windows_arm }}" == "true" then
                  {release_for:"Windows-arm64", os:"windows-arm64", bin:"${{ needs.release.outputs.bin-name }}.exe", name:"${{ needs.release.outputs.pkg-name }}-Windows-arm64.zip"}
                else empty end)
              ]
            }
          ')
          
          echo "matrix<<EOF" >> $GITHUB_OUTPUT
          echo "$matrix" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        shell: bash

  upload_assets:
    needs: [release, prep]
    strategy:
      matrix: ${{ fromJson(needs.prep.outputs.matrix) }}

    name: Upload asset for ${{ matrix.release_for }}
    if: needs.release.outputs.release-flag == 'true'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - name: Release ID Propagation
        id: release-id-check
        run: |
          if [ -n "${{ needs.release.outputs.release-id }}" ]; then
            echo "Release ID propagated: ${{ needs.release.outputs.release-id }}"
          else
            echo "Release ID propagation failed. Exiting.."
            exit 1
          fi
          echo "start_time=$(date +%s)" >> "$GITHUB_ENV"
        shell: bash
      - name: Checkout Repo
        uses: actions/checkout@v4
      - name: Update Rust
        # print it with style
        run: |
          printf '*%.0s' {1..60} && printf "\n"
          echo "Existing rust version: $(rustc --version)"
          printf '*%.0s' {1..60} && printf "\n\n"
          rustup update && printf "\n"
          printf '*%.0s' {1..60} && printf "\n"
          echo "Updated rust version: $(rustc --version)"
          printf '*%.0s' {1..60} && printf "\n"
        shell: bash

      - name: Install OpenSSL static for Windows
        # https://github.com/sfackler/rust-openssl/issues/1086
        if: contains(matrix.os, 'windows')
        continue-on-error: true
        run: |
          if (-Not (Test-Path -Path $env:tools_dir)) {
            mkdir $env:tools_dir
          }
          cd $env:tools_dir
          if (-Not (Test-Path -Path $env:vcpkg_dir)) {
            git clone https://github.com/Microsoft/vcpkg.git $env:vcpkg_dir
          }
          cd $env:vcpkg_dir
          echo ("vcpkg_dir=" + $pwd) >> $env:GITHUB_ENV
          if (-Not (Test-Path -Path .\vcpkg.exe)) {
            .\bootstrap-vcpkg.bat -disableMetrics
          }
          .\vcpkg.exe install openssl:x64-windows-static --disable-metrics
        shell: pwsh
        env:
          tools_dir: "C:\\Tools"
          vcpkg_dir: "C:\\Tools\\vcpkg"

      - name: Build
        if: always()
        run: |
          if [[ "${{ matrix.os }}" =~ ^windows ]]; then
            if [[ -d "${{ env.vcpkg_dir }}/installed/x64-windows-static" ]]; then
              echo "::notice title=vcpkg installed::Setting vcpkg env vars for OpenSSL in Windows"
              export OPENSSL_DIR="${{ env.vcpkg_dir }}/installed/x64-windows-static"
              export OPENSSL_STATIC="Yes"
              export VCPKG_ROOT="${{ env.vcpkg_dir }}"
            else
              echo "::warning title=vcpkg not found::Missing OpenSSL Static, proceeding without it"
            fi
          fi
          cargo build --release
        shell: bash

      - name: Run tests
        run: |
          if [[ "${{ matrix.os }}" =~ ^windows ]]; then
            if [[ -d "${{ env.vcpkg_dir }}/installed/x64-windows-static" ]]; then
              echo "::notice title=vcpkg installed::Setting vcpkg env vars for OpenSSL in Windows"
              export OPENSSL_DIR="${{ env.vcpkg_dir }}/installed/x64-windows-static"
              export OPENSSL_STATIC="Yes"
              export VCPKG_ROOT="${{ env.vcpkg_dir }}"
            else
              echo "::warning title=vcpkg not found::Missing OpenSSL Static, proceeding without it"
            fi
          fi
          cargo test --no-run
        shell: bash

      - name: Compress and Copy Artifact (Windows)
        if: contains(matrix.os, 'windows')
        run: |
          mkdir -p ${{ needs.release.outputs.pkg-name }}
          cp target/release/${{ matrix.bin }} ${{ needs.release.outputs.pkg-name }}/${{ matrix.bin }}
          Compress-Archive -DestinationPath ${{ matrix.name }} -Path ${{ needs.release.outputs.pkg-name }}/
        shell: pwsh

      - name: Compress and Copy Artifact (macOS/Ubuntu)
        if: "!contains(matrix.os, 'windows')"
        run: |
          mkdir -p ${{ needs.release.outputs.pkg-name }}
          cp target/release/${{ matrix.bin }} ${{ needs.release.outputs.pkg-name }}/${{ matrix.bin }}
          tar -zcvf ${{ matrix.name }} ${{ needs.release.outputs.pkg-name }}/
        shell: bash

      - name: Upload Asset to Release
        run: |
          curl -X POST -H "Authorization: token ${{ secrets.GIT_TOKEN }}" \
          -H "Content-Type: application/octet-stream" \
          --data-binary @"${{ matrix.name }}" \
          "https://uploads.github.com/repos/${{ github.repository }}/releases/${{ needs.release.outputs.release-id }}/assets?name=${{ matrix.name }}"
        shell: bash

      - name: Runtime Analyzer
        run: |
          start=${{ env.start_time }}
          end=$(date +%s)
          time_taken=$((end-start))
          url="${{ github.server_url }}/${{ github.repository }}/releases/download/${{ needs.release.outputs.release-tag }}/${{ matrix.name }}"
          hyperlink="[${{ matrix.release_for }}]($url)"
          echo "🚀 Built for $hyperlink in $time_taken seconds" >> $GITHUB_STEP_SUMMARY
        shell: bash

  publish-crate:
    needs:
      - release
      - upload_assets
    if: inputs.publish_crate == 'true' && needs.release.outputs.release-flag == 'true'
    runs-on: thevickypedia-default
    steps:
      - uses: actions/checkout@v4
      - name: Update Rust
        run: |
          printf '*%.0s' {1..60} && printf "\n"
          echo "Existing rust version: $(rustc --version)"
          printf '*%.0s' {1..60} && printf "\n\n"
          rustup update && printf "\n"
          printf '*%.0s' {1..60} && printf "\n"
          echo "Updated rust version: $(rustc --version)"
          printf '*%.0s' {1..60} && printf "\n"
        shell: bash
      - name: Release Crate
        run: |
          cargo login ${{ secrets.CRATES_TOKEN }}
          cargo publish --allow-dirty  # Set allow-dirty since building will create a /target folder that will be uncommitted in git
        shell: bash
